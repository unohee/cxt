# cxt CI: lint, tests, accuracy gates and a self-scan smoke (AGT-3880).
#
# Self-contained on purpose: the reusable unohee/ci-templates node-ci.yml this
# repository was meant to call has never been published, and a caller that
# points at a missing workflow can only fail. Move to the shared template once
# it exists on ci-templates main.
#
# The test job runs on Node 22/24 x ubuntu/macos so the native dependencies
# (better-sqlite3, tree-sitter grammars) are exercised on every platform the
# package claims. The accuracy and self-scan jobs are platform-independent and
# run once.

name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Cancel superseded runs of the same pull request; every push gets its own group.
  group: ci-${{ github.event_name }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    name: lint (tsc --noEmit)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run lint

  test:
    name: test (node ${{ matrix.node }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        node: ['22', '24']
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test
      - name: packed package smoke (npm pack, clean prefix install, AST parse)
        run: node scripts/test-packed-frontends.mjs

  accuracy-gate:
    name: accuracy-gate (bench:all)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run bench:all -- --output bench-all.json
      - name: Upload gate report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: bench-all
          path: bench-all.json
          if-no-files-found: ignore

  self-scan:
    name: self-scan (cxt scan on its own source)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run ci:self-scan
