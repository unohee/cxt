[package]
name = "ctx"
version = "0.1.0"
edition = "2021"
description = "Code context toolkit — registry, BS detector, and AI context injection"
license = "MIT"

[[bin]]
name = "ctx"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
rusqlite = { version = "0.31", features = ["bundled", "modern-full"] }
regex = "1"
walkdir = "2"
colored = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "5"

[profile.release]
opt-level = 3
lto = true
strip = true
